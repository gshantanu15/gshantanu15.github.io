name: Check portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate static site
        run: node scripts/check-site.mjs
